# Docker Compose file for Vapor
#
# Install Docker on your system to run and test
# your Vapor app in a production-like environment.
#
# Note: This file is intended for testing and does not
# implement best practices for a production deployment.
#
# Learn more: https://docs.docker.com/compose/reference/
#
#   Build images: docker-compose build
#      Start app: docker-compose up app
# Start database: docker-compose up db
# Run migrations: docker-compose run migrate
#       Stop all: docker-compose down (add -v to wipe db)
#
# MQTT (mosquito) configuration
# https://cedalo.com/blog/mosquitto-docker-configuration-ultimate-guide/

version: '3.7'

x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DATABASE_HOST: db
  DATABASE_NAME: ${POSTGRES_DB:-hermes_database}
  DATABASE_USERNAME: ${POSTGRES_USER:-hermes_username}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-hermes_password}
  STORAGE_AVATARS: storage/avatars
  STORAGE_IMAGES: storage/images
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: 465
  SMTP_AUTH: <YOUR email on mail server>
  SMTP_PASS: <YOUR password to your mail server>

  
services:
  db:
    image: postgres:14-alpine
    volumes:
      - db_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hermes_username}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hermes_password}
      POSTGRES_DB: ${POSTGRES_DB:-hermes_database}
    ports:
      - "5432:5432"
    networks:
        - hermes
  app:
    image: hermes:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      - db
    ports:
      - "8080:8080"
    # user: '0' # uncomment to run as root for testing purposes even though Dockerfile defines 'vapor' user.
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
    volumes:
      - ../storage/avatars:/app/storage/avatars
      - ../storage/images:/app/storage/images
    networks:
        - hermes
  migrate:
    image: hermes:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      - db
    command: ["migrate", "--yes"]
    deploy:
      replicas: 0
  revert:
    image: hermes:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      - db
    command: ["migrate", "--revert", "--yes"]
    deploy:
      replicas: 0

#  mosquitto:
#    image: eclipse-mosquitto:latest
#    ports:
#        - 1883:1883
#        - 8883:8883
#        - 9001:9001
#    volumes:
#        - ../storage/mosquitto/data:/mosquitto/data
#        - ../storage/mosquitto/log:/mosquitto/log
#    networks:
#        - hermes

  mqtt:
    image: demonsoft/hermes_mqtt:v1
    ports:
        - 1883:1883
        - 8883:8883
        - 9001:9001
    volumes:
        - ../storage/mosquitto/data:/mosquitto/data
        - ../storage/mosquitto/log:/mosquitto/log
    networks:
        - hermes

networks:
    hermes:
        name: hermes
        driver: bridge


volumes:
  storage:
  db_data:
